<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Best Cars Dealership</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Create an Account</h2>
                        <div id="message" class="alert d-none" role="alert"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input id="username" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input id="email" name="email" type="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input id="password" name="password" type="password"
                                       class="form-control" minlength="8" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Register</button>
                        </form>

                        <p class="text-center mt-3">
                            Already have an account? <a href="login.html">Login</a>
                        </p>
                        <p class="text-center"><a href="index.html">Back to home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8001";

        document.getElementById("registerForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = document.getElementById("message");
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch(`${API_BASE}/api/users/register/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();
                message.className = response.ok
                    ? "alert alert-success"
                    : "alert alert-danger";
                message.textContent = data.message || data.error || (
                    response.ok ? "Registration successful! You can now log in." : "Registration failed."
                );
            } catch (error) {
                message.className = "alert alert-danger";
                message.textContent = "Could not connect to the server. Make sure the Django backend is running.";
            }
        });
    </script>
</body>
</html>
