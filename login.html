<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Best Cars Dealership</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Login</h2>
                        <div id="message" class="alert d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input id="username" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input id="password" name="password" type="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>

                        <p class="text-center mt-3">
                            Don't have an account? <a href="register.html">Register</a>
                        </p>
                        <p class="text-center"><a href="index.html">Back to home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8003";

        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = document.getElementById("message");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch(`${API_BASE}/api/users/login/`, {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                
const data = await response.json();

if (response.ok) {

    localStorage.setItem("loggedInUser", data.username || username);
    message.className = "alert alert-success";
    message.textContent = data.message || "Login successful! Redirecting...";

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);
} else {
    message.className = "alert alert-danger";
    message.textContent = data.message || data.error || "Login failed.";
}

            } catch (error) {
                message.className = "alert alert-danger";
                message.textContent = "Could not connect to the server. Make sure the Django backend is running.";
            }
        });
    </script>
</body>
</html>
